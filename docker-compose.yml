version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Performance tuning for vector operations
      POSTGRES_SHARED_BUFFERS: 2GB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 8GB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - atlas-network

volumes:
  postgres_data:
    driver: local

networks:
  atlas-network:
    driver: bridge

# Usage:
# ------
# 1. Create a .env file with your credentials (see .env.example).
#
# Start Postgres with pgvector:
#   docker compose up -d
#
# Stop it:
#   docker compose down
#
# Stop it and delete the data volume:
#   docker compose down -v
#
# The API and the frontend run on the host; see docs/SETUP.md.
